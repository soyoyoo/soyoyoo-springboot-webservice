name: Java CI/CD with Gradle (Direct SSH Deploy)

on:
  push:
    branches: [ "master" ] # main 브랜치를 사용중이라면 main으로 수정

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스코드 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Java 21 환경 세팅
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Gradle 캐싱 (빌드 속도 향상)
    - name: Gradle Caching
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. 프로젝트 빌드
    - name: Build with Gradle
      run: ./gradlew build

    # 6. EC2 인스턴스로 빌드 결과물(JAR) 및 deploy.sh 전달 (SCP)
    - name: Transfer Files to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/*.jar,deploy.sh" # 배포에 필요한 파일 지정
        target: "/home/ec2-user/app/step2/" # EC2 내 대상 디렉토리
        strip_components: 2

    # 7. EC2에서 배포 스크립트 실행 (SSH)
    - name: Execute Deploy Script on EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/app/step2
          chmod +x deploy.sh
          ./deploy.sh