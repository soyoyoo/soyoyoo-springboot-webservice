name: Java CI/CD with Gradle (Direct SSH Deploy)

on:
  push:
    branches: [ "master" ] # main 브랜치를 사용중이라면 main으로 수정

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스코드 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Java 21 환경 세팅
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Gradle 캐싱 (빌드 속도 향상)
    - name: Gradle Caching
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. 프로젝트 빌드
    - name: Build with Gradle
      run: ./gradlew build

      # 6. EC2 인스턴스로 빌드 결과물(JAR) 및 scripts/ 내 스크립트 전달 (SCP)
    - name: Transfer Files to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/*.jar,scripts/*.sh"
        target: "/home/ec2-user/app/step3" # (계정명이 ec2-user가 맞는지 확인!)

      # 7. EC2에서 무중단 배포 스크립트 실행 (SSH)
    - name: Execute Deploy Script on EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/app/step3
          
          # SCP로 복사되어 들어온 파일들 위치 확인 후 루트로 이동
          cp ./build/libs/*.jar ./ 2>/dev/null || true
          cp ./scripts/*.sh ./ 2>/dev/null || true
          
          # 권한 부여 및 배포 실행
          chmod +x *.sh
          ./deploy.sh